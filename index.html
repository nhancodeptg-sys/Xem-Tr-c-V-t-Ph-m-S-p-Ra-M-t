<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo trì - Xem trước vật phẩm Play Together</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #94a3b8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* Ảnh nền động được làm sáng và rõ hơn */
        .bg-animation {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: url('https://cdn.upanhlaylink.com/i/ccyklmbi.png');
            background-repeat: repeat;
            background-size: 500px auto; 
            opacity: 0.35; /* Tăng độ hiển thị của ảnh nền */
            filter: blur(4px); /* Giảm độ nhòe để thấy rõ hình khối hơn */
            z-index: 0;
            animation: moveBackground 30s linear infinite;
        }

        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(150px, 150px);
            }
        }

        /* Lớp phủ mỏng nhẹ để chữ vẫn dễ đọc nhưng không che mất ảnh */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 41, 0.45);
            z-index: 1;
        }

        /* Khung ở giữa được làm sáng, nổi bật hẳn lên */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 540px;
            background: rgba(25, 37, 67, 0.9); /* Nền sáng và rõ nét hơn */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Viền sáng hơn */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 44px 36px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 24px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .main-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
            line-height: 1.5;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 28px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
            margin-bottom: 24px;
        }

        .support-info {
            font-size: 0.825rem;
            color: #94a3b8;
        }

        .support-info a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .support-info a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Responsive cho mobile */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }
            .main-title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ảnh nền động di chuyển rõ hơn -->
    <div class="bg-animation"></div>
    <div class="overlay"></div>

    <!-- Khung thông báo chính -->
    <div class="card">
        <div class="status-badge">
            <span class="status-dot"></span>
            Hệ thống đang bảo trì
        </div>

        <div class="main-title">Đang cập nhật bảo trì web xem trước vật phẩm Play Together</div>
        
        <p>Chúng tôi đang nâng cấp và làm mới dữ liệu để mang đến cho bạn những thông tin vật phẩm chính xác nhất. Xin vui lòng quay lại sau ít phút.</p>
        
        <div class="divider"></div>

        <div class="support-info">
            Cần hỗ trợ? Liên hệ qua email <a href="mailto:nhancodeptg@gmail.com">nhancodeptg@gmail.com</a>
        </div>
    </div>

</body>
</html>
