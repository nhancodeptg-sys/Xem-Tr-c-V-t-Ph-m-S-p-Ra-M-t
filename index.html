    function updateIcons() {
      if (document.documentElement.classList.contains('dark')) {
        darkIcon.classList.add('hidden'); lightIcon.classList.remove('hidden');
      } else {
        lightIcon.classList.add('hidden'); darkIcon.classList.remove('hidden');
      }
    }
    updateIcons();

    themeToggleBtn.addEventListener('click', function() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark'); localStorage.setItem('color-theme', 'light');
      } else {
        document.documentElement.classList.add('dark'); localStorage.setItem('color-theme', 'dark');
      }
      updateIcons();
    });

    function filterPreview(category) {
      document.querySelectorAll('.preview-tab').forEach(tab => {
        tab.classList.remove('bg-brand-orange', 'text-white', 'shadow-sm');
        tab.classList.add('text-slate-500', 'dark:text-slate-400');
      });
      const activeTab = document.getElementById(`tab-${category}`);
      if(activeTab) {
        activeTab.classList.remove('text-slate-500', 'dark:text-slate-400');
        activeTab.classList.add('bg-brand-orange', 'text-white', 'shadow-sm');
      }
      document.querySelectorAll('.preview-card').forEach(card => {
        if(category === 'all' || card.getAttribute('data-category') === category) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    function openDetailPopup(name, type, status, description, mainImages, smallItems) {
      const popup = document.getElementById('detail-popup');
      document.getElementById('modal-title').innerText = name;
      const descEl = document.getElementById('modal-description');
      descEl.innerText = description || "";
      descEl.style.display = description ? 'block' : 'none';
      
      const badge = document.getElementById('modal-badge');
      if (type === 'vvip_pass') {
        badge.className = "px-3.5 py-1 text-[11px] font-extrabold uppercase rounded-full shadow-sm bg-yellow-500 text-white mb-3 inline-block";
        badge.innerText = 'VIP Pass';
      } else if (type === 'bt21') {
        badge.className = "px-3.5 py-1 text-[11px] font-extrabold uppercase rounded-full shadow-sm bg-purple-600 text-white mb-3 inline-block";
        badge.innerText = 'Gói BT21';
      } else if (type === 'lucky_box') {
        badge.className = "px-3.5 py-1 text-[11px] font-extrabold uppercase rounded-full shadow-sm bg-brand-orange text-white mb-3 inline-block";
        badge.innerText = 'Hộp Bốc Thăm';
      } else {
        badge.className = "px-3.5 py-1 text-[11px] font-extrabold uppercase rounded-full shadow-sm bg-brand-orange text-white mb-3 inline-block";
        badge.innerText = 'Gói Sản Phẩm';
      }
      
      const carousel = document.getElementById('modal-carousel');
      carousel.innerHTML = '';
      mainImages.forEach((img, idx) => {
        const imgEl = document.createElement('img');
        imgEl.src = img;
        imgEl.className = `absolute inset-0 w-full h-full object-cover modal-slider-img ${idx === 0 ? 'active' : 'inactive'}`;
        carousel.appendChild(imgEl);
      });
      
      const itemsContainer = document.getElementById('modal-items-container');
      const smallItemsGrid = document.getElementById('modal-small-items');
      smallItemsGrid.innerHTML = '';
      if(smallItems && smallItems.length > 0) {
        itemsContainer.classList.remove('hidden');
        smallItems.forEach(itemSrc => {
          const col = document.createElement('div');
          col.className = 'item-watermark-container aspect-square rounded-xl bg-slate-100 dark:bg-slate-800 p-1 border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden';
          col.innerHTML = `<img src="${itemSrc}" class="w-full h-full object-contain rounded-lg">`;
          smallItemsGrid.appendChild(col);
        });
      } else {
        itemsContainer.classList.add('hidden');
      }
      
      popup.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    
    function closeDetailPopup() {
      document.getElementById('detail-popup').style.display = 'none';
      document.body.style.overflow = '';
    }
    
    document.addEventListener('click', function(e) {
      if(e.target === document.getElementById('detail-popup')) closeDetailPopup();
    });
  </script>
</body>
</html>
